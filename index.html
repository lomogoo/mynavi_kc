<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d9622b">
<title>キッチンカー出店調整</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%9B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo" aria-hidden="true">🚚</span>
      <span>キッチンカー出店調整<small>2〜3台 / 全7日程</small></span>
    </div>
    <div class="topbar-actions">
      <span class="sync" id="sync" data-state="init" title="Supabase との同期状態">
        <span class="dot" aria-hidden="true"></span>
        <span id="sync-label">接続中…</span>
      </span>
      <a class="btn btn-sm btn-doc" id="link-guidelines" target="_blank" rel="noopener noreferrer"
         title="出店要項（Google スライド）を新しいタブで開く" hidden>
        <span aria-hidden="true">📄</span>出店要項
      </a>
      <button class="btn btn-sm" id="btn-me" title="更新履歴に残る名前">担当者</button>
      <button class="btn btn-sm" id="btn-csv" title="CSV を書き出す">CSV</button>
      <button class="btn btn-sm" id="btn-reload" title="最新の状態を読み込む">再読込</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div id="notice-host"></div>

  <section class="summary" id="summary" hidden></section>

  <div class="toolbar" id="toolbar" hidden>
    <label class="check">
      <input type="checkbox" id="chk-declined">見送りも表示
    </label>
    <span class="spacer"></span>
    <button class="btn btn-sm" id="btn-add-date">＋ 日程を追加</button>
  </div>

  <div id="add-date-host"></div>

  <main class="board" id="board" aria-live="polite"></main>

  <p class="footnote">
    データは Supabase で同期されます。同じ URL を開いている全員に自動反映されます。<br>
    このページを知っている人は誰でも編集できます。共有範囲にご注意ください。
  </p>
</div>

<div class="toast-host" id="toast-host"></div>

<datalist id="vendor-suggest"></datalist>
<datalist id="genre-suggest"></datalist>

<script src="assets/vendor/supabase-js-2.116.0.umd.js"></script>
<script src="assets/config.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
